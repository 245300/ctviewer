<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>动作逐条自检</title>
<style>
  html, body { margin:0; background:#0b0d10; color:#cfe3ff; font:12px/1.5 ui-monospace,monospace; }
  #hud { padding:6px 10px; white-space:pre-wrap; }
  canvas { display:block; }
  .label { position:absolute; font:11px/1.3 ui-monospace,monospace; color:#9fd8ff; background:rgba(4,10,16,.72); padding:2px 5px; border-radius:3px; }
</style>
</head>
<body>
<div id="hud">loading…</div>
<canvas id="sheet"></canvas>
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { adaptHipsClip, applyGroundLift } from '/js/character-clips.js';

// Every clip at three points of its arc, rendered one after another into one
// contact sheet.  ?page=1..3 shows five clips per page (15 total).
//   /tools/anim_audit.html?page=1&id=colphne&tile=260
const q = new URLSearchParams(location.search);
const page = Math.max(1, Number(q.get('page') || 1));
const id = q.get('id') || 'colphne';
const tile = Number(q.get('tile') || 260);
const perPage = Number(q.get('per') || 5);
const hud = document.getElementById('hud');
window.__ERR__ = [];
window.addEventListener('error', (e) => window.__ERR__.push(String(e.error?.stack || e.message || e.error)));
window.addEventListener('unhandledrejection', (e) => window.__ERR__.push('rejection: ' + (e.reason?.stack || e.reason)));

const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('/vendor/draco/');
loader.setDRACOLoader(draco);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.setSize(tile, tile);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151a20);
scene.add(new THREE.HemisphereLight(0xdfefff, 0x2a3038, 2.2));
const key = new THREE.DirectionalLight(0xfff2e0, 2.6);
key.position.set(3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x7fb4ff, 1.6);
rim.position.set(-4, 3, -3);
scene.add(rim);
scene.add(new THREE.GridHelper(6, 12, 0x33506b, 0x22303d));

const catalog = await fetch(`/assets/characters/characters.json?t=${Date.now()}`, { cache: 'no-store' }).then((r) => r.json());
const ground = await fetch(`/assets/characters/ground.json?t=${Date.now()}`, { cache: 'no-store' })
  .then((r) => (r.ok ? r.json() : null)).catch(() => null);
const animGltf = await loader.loadAsync(`/${catalog.animationsUrl}?t=${Date.now()}`);
const clips = new Map(animGltf.animations.map((c) => [c.name, c]));
const meta = catalog.characters.find((c) => c.id === id);
const gltf = await loader.loadAsync(`/${meta.url}?t=${Date.now()}`);
const root = gltf.scene;
root.traverse((o) => {
  if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; o.frustumCulled = false; }
});
scene.add(root);
const mixer = new THREE.AnimationMixer(root);
// Show what the game shows: hips rebased onto this rig and floor-contact lift.
const hipsRest = root.getObjectByName('Hips')?.position.clone() || null;
for (const [name, clip] of clips) {
  const adapted = adaptHipsClip(clip, meta.hipHeight, catalog.refHipHeight, hipsRest);
  applyGroundLift(adapted, ground?.characters?.[id]?.[name]);
  clips.set(name, adapted);
}

const times = [0.18, 0.5, 0.82];
const names = [...clips.keys()];
const shown = names.slice((page - 1) * perPage, page * perPage);
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);

const sheet = document.getElementById('sheet');
sheet.width = tile * times.length;
sheet.height = tile * shown.length;
renderer.setSize(tile, tile, false);
const ctx = sheet.getContext('2d');
ctx.fillStyle = '#0b0d10';
ctx.fillRect(0, 0, sheet.width, sheet.height);
ctx.font = '600 13px ui-monospace,monospace';

function poseBox() {
  const box = new THREE.Box3();
  let any = false;
  root.traverse((o) => {
    if (!o.isSkinnedMesh) return;
    o.computeBoundingBox?.();
    if (!o.boundingBox) return;
    box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
    any = true;
  });
  if (!any) box.setFromObject(root);
  return box;
}

let stats = [];
for (let row = 0; row < shown.length; row++) {
  const clip = clips.get(shown[row]);
  const action = mixer.clipAction(clip);
  action.reset();
  action.setLoop(THREE.LoopRepeat, Infinity);
  action.play();
  for (let col = 0; col < times.length; col++) {
    mixer.setTime(clip.duration * times[col]);
    root.updateMatrixWorld(true);
    const box = poseBox();
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const dist = Math.max(1.9, size.y * 1.7, size.x * 1.5);
    camera.position.set(center.x + dist * 0.55, center.y + size.y * 0.08, center.z + dist * 0.84);
    camera.lookAt(center.x, center.y - size.y * 0.02, center.z);
    renderer.render(scene, camera);
    ctx.drawImage(renderer.domElement, 0, 0, tile, tile, col * tile, row * tile, tile, tile);
    ctx.fillStyle = 'rgba(4,10,16,.72)';
    ctx.fillRect(col * tile + 6, row * tile + 6, 118, 18);
    ctx.fillStyle = '#9fd8ff';
    ctx.fillText(`${shown[row]} ${(clip.duration * times[col]).toFixed(2)}s`, col * tile + 10, row * tile + 19);
    ctx.fillStyle = 'rgba(4,10,16,.72)';
    ctx.fillRect(col * tile + 6, row * tile + tile - 22, 150, 16);
    ctx.fillStyle = Math.abs(box.min.y) > 0.06 ? '#ff9b9b' : '#9fd8ff';
    ctx.fillText(`y ${box.min.y.toFixed(2)}..${box.max.y.toFixed(2)}`, col * tile + 10, row * tile + tile - 10);
    stats.push({ clip: shown[row], t: +(clip.duration * times[col]).toFixed(2), minY: +box.min.y.toFixed(3), maxY: +box.max.y.toFixed(3) });
  }
  action.stop();
}

hud.textContent = `page ${page} · ${id} · ${stats.length} poses\n` +
  stats.map((s) => `${s.clip.padEnd(30)} ${String(s.t).padStart(5)}s  y ${s.minY}..${s.maxY}`).join('\n');
window.__STATS__ = stats;
window.__DONE__ = true;
</script>
</body>
</html>
